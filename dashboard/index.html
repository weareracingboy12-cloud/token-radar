<!doctype html>
<!-- Token Radar dashboard shell: the board mounts into #board; data.js
     carries the whole dataset, app.js renders it. No network is used. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1">
    <title>Token Radar: pre-token protocols ranked by implied value</title>
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <a class="skip" href="#board">Skip to the board</a>
    <main id="board" tabindex="-1" aria-busy="true"></main>
    <script src="../data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
